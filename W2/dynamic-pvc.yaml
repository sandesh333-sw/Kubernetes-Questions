# PVC with dynamic provisioning (no need to create PV manually)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-dynamic-gp3
  labels:
    app: web-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: aws-ebs-gp3  # StorageClass will auto-create PV
  resources:
    requests:
      storage: 20Gi

---
# High-performance storage for database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-database-io2
  labels:
    app: postgres
    tier: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: aws-ebs-io2
  resources:
    requests:
      storage: 100Gi

---
# Shared storage for multiple pods (requires RWX support)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-shared-nfs
  labels:
    app: file-server
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 50Gi

---
# Pod using dynamically provisioned storage
apiVersion: v1
kind: Pod
metadata:
  name: app-with-dynamic-storage
  labels:
    app: web-app
spec:
  containers:
  - name: nginx
    image: nginx:1.24
    ports:
    - containerPort: 80
    volumeMounts:
    - name: web-storage
      mountPath: /usr/share/nginx/html
  
  volumes:
  - name: web-storage
    persistentVolumeClaim:
      claimName: pvc-dynamic-gp3

---
# StatefulSet example with dynamic provisioning
# (StatefulSets automatically create PVCs)
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    name: postgres
  clusterIP: None
  selector:
    app: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-service
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: mydb
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  
  # Volume Claim Template - creates PVC for each replica
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: aws-ebs-gp3
      resources:
        requests:
          storage: 50Gi

