apiVersion: v1
kind: Pod
metadata:
  name: app-with-config-secret
  labels:
    app: demo-app
spec:
  containers:
  - name: app-container
    image: nginx:1.24
    
    # Method 1: Individual environment variables from ConfigMap
    env:
    - name: DATABASE_URL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: DATABASE_URL
    
    - name: LOG_LEVEL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: LOG_LEVEL
    
    # Method 2: Individual environment variables from Secret
    - name: DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: username
    
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: password
    
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: api-key
    
    # Method 3: All keys from ConfigMap as env vars
    envFrom:
    - configMapRef:
        name: app-config
      prefix: CONFIG_  # Optional: adds prefix to all keys
    
    # Mount ConfigMap as files
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
      readOnly: true
    
    # Mount Secret as files (more secure than env vars)
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
    
    # Mount specific ConfigMap file
    - name: nginx-config
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: nginx.conf
    
    ports:
    - containerPort: 80
  
  volumes:
  # ConfigMap volume - creates files for each key
  - name: config-volume
    configMap:
      name: app-config
  
  # Secret volume - creates files for each key
  - name: secret-volume
    secret:
      secretName: app-secret
      defaultMode: 0400  # Read-only for owner
  
  # Mount specific item from ConfigMap
  - name: nginx-config
    configMap:
      name: app-config
      items:
      - key: nginx.conf
        path: nginx.conf

---
# Example 2: Pod with selective ConfigMap/Secret mounting
apiVersion: v1
kind: Pod
metadata:
  name: app-selective-mount
  labels:
    app: demo-app
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["/bin/sh"]
    args:
    - -c
    - |
      echo "=== Environment Variables ==="
      env | grep -E "(DATABASE|LOG|USERNAME|PASSWORD)" | sort
      echo ""
      echo "=== Config Files ==="
      ls -la /etc/config/
      cat /etc/config/app.properties
      echo ""
      echo "=== Secret Files ==="
      ls -la /etc/secrets/
      echo "Username: $(cat /etc/secrets/username)"
      echo "Sleeping..."
      sleep 3600
    
    env:
    # Only specific keys from ConfigMap
    - name: DATABASE_URL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: DATABASE_URL
    - name: LOG_LEVEL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: LOG_LEVEL
    
    # Secrets from Secret
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: username
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: password
    
    volumeMounts:
    - name: config-files
      mountPath: /etc/config
    - name: secret-files
      mountPath: /etc/secrets
      readOnly: true
  
  volumes:
  - name: config-files
    configMap:
      name: app-config
      items:
      - key: app.properties
        path: app.properties
  
  - name: secret-files
    secret:
      secretName: app-secret

