apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: demo-app
type: Opaque
data:
  # Base64 encoded values
  # To encode: echo -n "value" | base64
  # To decode: echo "encoded" | base64 -d
  
  username: YWRtaW4=              # admin
  password: cGFzc3dvcmQxMjM=      # password123
  api-key: bXktc2VjcmV0LWFwaS1rZXktMTIzNDU2  # my-secret-api-key-123456
  
---
# Alternative: Using stringData (automatically base64 encoded)
apiVersion: v1
kind: Secret
metadata:
  name: app-secret-v2
  labels:
    app: demo-app
type: Opaque
stringData:
  # Plain text - Kubernetes will encode it
  username: admin
  password: password123
  api-key: my-secret-api-key-123456
  db-connection: "postgresql://admin:password123@db.example.com:5432/mydb"

---
# Docker registry secret example
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6eyJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOnsidXNlcm5hbWUiOiJteXVzZXIiLCJwYXNzd29yZCI6Im15cGFzc3dvcmQiLCJhdXRoIjoiYlhsMWMyVnlPbTE1Y0dGemMzZHZjbVE9In19fQ==

---
# TLS Secret example
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
type: kubernetes.io/tls
data:
  # These should be actual base64 encoded cert and key
  tls.crt: LS0tLS1CRUdJTi...
  tls.key: LS0tLS1CRUdJTi...

