apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-resources
  labels:
    app: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo
  
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80
        
        # Resource Requests and Limits
        resources:
          # Requests - minimum guaranteed resources
          requests:
            cpu: 250m      # 0.25 CPU cores
            memory: 128Mi  # 128 MiB RAM
          
          # Limits - maximum resources allowed
          limits:
            cpu: 500m      # 0.5 CPU cores
            memory: 256Mi  # 256 MiB RAM

---
# QoS Class: Guaranteed (requests = limits)
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  labels:
    qos: guaranteed
spec:
  containers:
  - name: nginx
    image: nginx:1.24
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 500m       # Same as request
        memory: 256Mi   # Same as request

---
# QoS Class: Burstable (requests < limits)
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
  labels:
    qos: burstable
spec:
  containers:
  - name: nginx
    image: nginx:1.24
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        cpu: 1000m      # Can burst to 1 CPU
        memory: 512Mi   # Can burst to 512Mi

---
# QoS Class: BestEffort (no requests/limits)
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  labels:
    qos: besteffort
spec:
  containers:
  - name: nginx
    image: nginx:1.24
    # No resources defined = BestEffort

---
# Multi-container pod with different resource profiles
apiVersion: v1
kind: Pod
metadata:
  name: multi-container-resources
spec:
  containers:
  # Main application - high resources
  - name: app
    image: nginx:1.24
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  
  # Sidecar - logging agent (low resources)
  - name: log-collector
    image: busybox:1.36
    command: ["sh", "-c", "tail -f /var/log/app.log"]
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  
  # Sidecar - metrics exporter (medium resources)
  - name: metrics-exporter
    image: prom/node-exporter:latest
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

---
# Example: Resource-intensive workload (database)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-high-resources
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        
        env:
        - name: POSTGRES_PASSWORD
          value: postgres
        
        resources:
          requests:
            cpu: 1000m     # 1 CPU core
            memory: 2Gi    # 2 GB RAM
          limits:
            cpu: 2000m     # Up to 2 CPU cores
            memory: 4Gi    # Up to 4 GB RAM
        
        ports:
        - containerPort: 5432

---
# Example: Lightweight workload (static website)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-website
  labels:
    app: website
spec:
  replicas: 5
  selector:
    matchLabels:
      app: website
  
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
      - name: nginx
        image: nginx:1.24-alpine
        
        resources:
          requests:
            cpu: 50m       # Very light CPU
            memory: 32Mi   # Minimal memory
          limits:
            cpu: 100m
            memory: 64Mi
        
        ports:
        - containerPort: 80

---
# Example: Batch job with resource limits
apiVersion: batch/v1
kind: Job
metadata:
  name: data-processing-job
spec:
  template:
    metadata:
      labels:
        app: batch-job
    spec:
      restartPolicy: Never
      containers:
      - name: processor
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          import time
          print("Processing data...")
          time.sleep(30)
          print("Done!")
        
        resources:
          requests:
            cpu: 2000m     # 2 CPU cores
            memory: 4Gi    # 4 GB RAM
          limits:
            cpu: 4000m     # Max 4 CPU cores
            memory: 8Gi    # Max 8 GB RAM

---
# LimitRange - Set default resources at namespace level
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
spec:
  limits:
  # Default limits for containers
  - max:
      cpu: 2000m
      memory: 2Gi
    min:
      cpu: 50m
      memory: 32Mi
    default:
      cpu: 500m
      memory: 256Mi
    defaultRequest:
      cpu: 250m
      memory: 128Mi
    type: Container
  
  # Limits for Pods
  - max:
      cpu: 4000m
      memory: 8Gi
    type: Pod

---
# ResourceQuota - Limit total resources in namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
spec:
  hard:
    # Compute resources
    requests.cpu: "10"        # Total CPU requests
    requests.memory: 20Gi     # Total memory requests
    limits.cpu: "20"          # Total CPU limits
    limits.memory: 40Gi       # Total memory limits
    
    # Object counts
    pods: "50"                # Max 50 pods
    services: "20"            # Max 20 services
    persistentvolumeclaims: "10"  # Max 10 PVCs
    
    # Storage
    requests.storage: 100Gi   # Total storage requests

