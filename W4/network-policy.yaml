---
# 12. Combined ingress/egress with multiple sources
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: complex-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow from frontend pods
  - from:
    - podSelector:
        matchLabels:
          tier: frontend
    ports:
    - protocol: TCP
      port: 8080
  
  # Allow from admin namespace
  - from:
    - namespaceSelector:
        matchLabels:
          purpose: admin
    ports:
    - protocol: TCP
      port: 8080
  
  # Allow from specific IP range (load balancer)
  - from:
    - ipBlock:
        cidr: 10.0.1.0/24
    ports:
    - protocol: TCP
      port: 8080
  
  egress:
  # Allow to database
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  
  # Allow to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS to external
  - ports:
    - protocol: TCP
      port: 443

