# Simple CRD Example - Database

# 1. Define Custom Resource Definition
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.example.com
spec:
  # Group name
  group: example.com
  
  # Resource names
  names:
    kind: Database
    plural: databases
    singular: database
    shortNames:
    - db
  
  # Namespaced or Cluster-scoped
  scope: Namespaced
  
  # Versions
  versions:
  - name: v1
    served: true
    storage: true
    
    # Schema validation
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - size
            - version
            properties:
              size:
                type: string
                description: "Database storage size"
                pattern: '^[0-9]+Gi$'
              version:
                type: string
                description: "Database version"
                enum:
                - "14"
                - "15"
                - "16"
              replicas:
                type: integer
                description: "Number of replicas"
                minimum: 1
                maximum: 5
                default: 1
              backupEnabled:
                type: boolean
                description: "Enable automatic backups"
                default: true
          status:
            type: object
            properties:
              state:
                type: string
              message:
                type: string
    
    # Additional printer columns (kubectl get output)
    additionalPrinterColumns:
    - name: Version
      type: string
      jsonPath: .spec.version
    - name: Size
      type: string
      jsonPath: .spec.size
    - name: Replicas
      type: integer
      jsonPath: .spec.replicas
    - name: Status
      type: string
      jsonPath: .status.state
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    
    # Subresources
    subresources:
      status: {}  # Enable /status subresource
      scale:      # Enable /scale subresource
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas

---
# 2. Create Custom Resource Instance
apiVersion: example.com/v1
kind: Database
metadata:
  name: my-postgres
  namespace: default
spec:
  size: 10Gi
  version: "15"
  replicas: 3
  backupEnabled: true

---
# 3. Another example
apiVersion: example.com/v1
kind: Database
metadata:
  name: dev-postgres
spec:
  size: 5Gi
  version: "14"
  replicas: 1
  backupEnabled: false

---
# Advanced CRD Example - WebApp with more complex schema
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.apps.example.com
spec:
  group: apps.example.com
  names:
    kind: WebApp
    plural: webapps
    singular: webapp
    shortNames:
    - wa
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - image
            properties:
              image:
                type: string
                description: "Container image"
              replicas:
                type: integer
                minimum: 1
                maximum: 10
                default: 1
              port:
                type: integer
                minimum: 1
                maximum: 65535
                default: 8080
              env:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - value
                  properties:
                    name:
                      type: string
                    value:
                      type: string
              resources:
                type: object
                properties:
                  requests:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
              ingress:
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: false
                  hostname:
                    type: string
                  tls:
                    type: boolean
                    default: false
          status:
            type: object
            properties:
              availableReplicas:
                type: integer
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
    additionalPrinterColumns:
    - name: Image
      type: string
      jsonPath: .spec.image
    - name: Replicas
      type: integer
      jsonPath: .spec.replicas
    - name: Available
      type: integer
      jsonPath: .status.availableReplicas
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.availableReplicas

---
# Use the WebApp CRD
apiVersion: apps.example.com/v1
kind: WebApp
metadata:
  name: my-webapp
spec:
  image: nginx:1.24
  replicas: 3
  port: 80
  env:
  - name: APP_ENV
    value: production
  - name: LOG_LEVEL
    value: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    hostname: myapp.example.com
    tls: true

---
# CRD with validation webhook (requires cert-manager or manual certs)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: validatedapps.example.com
spec:
  group: example.com
  names:
    kind: ValidatedApp
    plural: validatedapps
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              image:
                type: string
                # Regex validation
                pattern: '^[a-z0-9\-\/]+:[a-z0-9\.-]+$'
              replicas:
                type: integer
                minimum: 1
                maximum: 100
              environment:
                type: string
                enum:
                - dev
                - staging
                - production
    # Custom validation rules
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-validations:
        - rule: "self.spec.replicas <= 10 || self.spec.environment == 'production'"
          message: "Only production can have more than 10 replicas"

